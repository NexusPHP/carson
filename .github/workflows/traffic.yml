name: Traffic

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic

jobs:
  collect:
    name: Accumulate clone counts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Switch to the traffic branch
        run: |
          set -euo pipefail
          cp .github/scripts/traffic.ts /tmp/traffic.ts
          if git fetch origin traffic 2>/dev/null; then
            git checkout traffic
          else
            git checkout --orphan traffic
            git rm -rf -q .
          fi

      - name: Fetch the clone-traffic window
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/traffic/clones" > /tmp/window.json

      - name: Merge into the cumulative store
        run: node /tmp/traffic.ts /tmp/window.json clones.json badge.json

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clones.json badge.json
          if git diff --cached --quiet; then
            echo "No traffic changes."
            exit 0
          fi
          git commit -m "Update traffic data"
          git push origin traffic
