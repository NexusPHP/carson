name: Traffic

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic

jobs:
  collect:
    name: Accumulate clone counts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Switch to the traffic branch
        run: |
          set -euo pipefail
          if git fetch origin traffic 2>/dev/null; then
            git checkout traffic
          else
            git checkout --orphan traffic
            git rm -rf -q .
          fi

      - name: Fetch the clone-traffic window
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/traffic/clones" > /tmp/window.json

      - name: Merge into the cumulative store
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const window_ = JSON.parse(fs.readFileSync('/tmp/window.json', 'utf8'));
          const data = fs.existsSync('clones.json')
            ? JSON.parse(fs.readFileSync('clones.json', 'utf8'))
            : { days: {} };

          for (const day of window_.clones) {
            const date = day.timestamp.slice(0, 10);
            data.days[date] = { count: day.count, uniques: day.uniques };
          }

          const total = Object.values(data.days).reduce((sum, d) => sum + d.count, 0);
          const message = total >= 1e6 ? `${(total / 1e6).toFixed(1)}M`
            : total >= 1e3 ? `${(total / 1e3).toFixed(1)}k`
            : String(total);

          fs.writeFileSync('clones.json', JSON.stringify(data, null, 2) + '\n');
          fs.writeFileSync('badge.json', JSON.stringify({
            schemaVersion: 1,
            label: 'action runs',
            message,
            color: 'blue',
          }, null, 2) + '\n');
          EOF

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clones.json badge.json
          if git diff --cached --quiet; then
            echo "No traffic changes."
            exit 0
          fi
          git commit -m "Update traffic data"
          git push origin traffic
